services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: exam-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NODE_ENV: production
      DB_CONNECTION: ${DB_CONNECTION}

    networks:
      - exam-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: exam-frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - exam-network


networks:
  exam-network:
    driver: bridge

